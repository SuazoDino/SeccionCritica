# H2 en memoria con compatibilidad PostgreSQL. Los datos se reinician al detener la aplicación.
spring.datasource.url=jdbc:h2:mem:seccioncritica;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=5000
spring.datasource.username=sa
spring.datasource.password=
spring.thymeleaf.cache=false

# Sin servidor de correo: la pantalla de acceso muestra las cuentas de prueba y el enlace de recuperación.
seccioncritica.demo=true
