spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seccioncritica}
spring.datasource.username=${DB_USER:seccion}
spring.datasource.password=${DB_PASSWORD}
# Una espera de bloqueo larga se corta y el usuario recibe "intenta nuevamente" en lugar de quedarse colgado.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'
