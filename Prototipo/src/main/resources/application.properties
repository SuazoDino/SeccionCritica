spring.application.name=SeccionCritica
spring.profiles.default=demo
server.port=${PORT:8080}
# Evita ;jsessionid=... en las URL tras un redirect con mensaje.
server.servlet.session.tracking-modes=cookie

# Esquema y datos de demostración en cada arranque (idempotentes).
spring.sql.init.mode=always

# Errores: nunca exponer trazas ni mensajes internos al navegador.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

# Fallar rápido en vez de dejar al usuario esperando si la base no responde.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=20
spring.transaction.default-timeout=15s

# Verificación en vivo: GET /actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Base de los enlaces de recuperación. Se fija por configuración para no confiar en la cabecera Host.
seccioncritica.url-publica=${URL_PUBLICA:http://localhost:${server.port}}
seccioncritica.demo=false
