services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: seccioncritica
      POSTGRES_USER: seccion
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD antes de iniciar}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seccion -d seccioncritica"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
